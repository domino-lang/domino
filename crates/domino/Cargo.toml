[package]
name = "domino"
version.workspace = true
edition.workspace = true
readme = { workspace = true }

[features]
# Forwards to sspverif's `cvc5-lib`; required for `domino debug`.
cvc5-lib = ["sspverif/cvc5-lib"]

[dependencies]
sspverif = { workspace = true }
clap = { version = "4.0", features = ["derive"] }
ctrlc = "3"
miette = { version = "7.6.0", features = ["fancy"] }
env_logger = "0.11"
shadow-rs = { version = "1.7", default-features = false }
thiserror = "1.0.61"

[build-dependencies]
sspverif = { workspace = true }
clap = { version = "4.0", features = ["derive"] }
clap_complete = "*"
shadow-rs = "1.7"
